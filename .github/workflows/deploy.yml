# Deploys the app to GitHub Pages whenever main changes. This is the only
# workflow that can write, and only its deploy job can: see
# docs/decisions/0013-deploy-to-github-pages.md. Checks run before merging,
# through the ruleset, so they aren't repeated here.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time. A newer push waits, rather than cancelling a
# deployment part way through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build for Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build with the SITE_URL repository variable
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "::error::Set the SITE_URL repository variable to where Pages serves the app."
            exit 1
          fi
          pnpm run build
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
